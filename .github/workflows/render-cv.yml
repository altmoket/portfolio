name: Render CV

on:
  schedule:
    # Every Monday at 06:00 UTC, so the "Last updated" date stays current.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cv
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.8"

      - name: Render CV to PDF
        run: |
          rendercv render cv/Leandro_Hernandez_CV.yaml \
            --dont-generate-markdown \
            --dont-generate-png \
            --pdf-path ../public/Leandro_Hernandez_CV.pdf

      - name: Commit updated PDF
        id: commit
        run: |
          if git diff --quiet -- public/Leandro_Hernandez_CV.pdf; then
            echo "PDF unchanged, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Leandro_Hernandez_CV.pdf
          git commit -m "chore(cv): render CV"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site is served from the gh-pages branch, so the new PDF only goes
      # live after rebuilding and publishing dist/.
      - name: Set up Node
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d dist \
            -m "chore: deploy site with rendered CV" \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
